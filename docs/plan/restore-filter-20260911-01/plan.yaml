tasks:
  - id: restore-home-feed-filter
    title: Restore Home feed picker, Menu, and mutable selectedFeed
    description: |
      Re-add selection UI plus mutable state using intact plumbing. reuse: existing codebase helper (FeedType.allCases + StoryRepository multi-feed methods + SwiftUI Menu/ScrollView) - no new deps, no stdlib-only fix, no new backend code.
      Step 1 ViewModel (HomeViewModel.swift): change `let selectedFeed: FeedType = .top` to `@Published var selectedFeed: FeedType = .top`; add `func selectFeed(_ feed: FeedType)` that guards same-feed no-op, sets selectedFeed, cancels loadTask, resets currentPage to 0, and reloads via existing loadInitial/refresh path; ensure loadInitial/refresh/loadMoreIfNeeded all use self.selectedFeed.
      Step 2 View (HomeView.swift): re-add horizontal pill picker above content (ScrollView horizontal, ForEach FeedType.allCases, capsule pill with feed icon + rawValue, selected style vs unselected, tap calls selectFeed with haptic/sound consistent with existing row taps); re-add toolbar Menu (line.3.horizontal.decrease icon) listing FeedType.allCases with icon, rawValue, checkmark on selectedFeed, each calling selectFeed; add .onChange(of: viewModel.selectedFeed) that Tasks reload if needed as safety net (picker/Menu already call selectFeed, avoid double load).
      Keep NavigationStack, OfflineBanner, content List/skeleton/empty/failed, refreshable, task loadInitial, navigationDestination, reduceMotion animations, StoryRowView save/pagination logic unchanged. Default first load is .top.
