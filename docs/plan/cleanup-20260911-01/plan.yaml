      Step 4 Launch: grep markBackgrounded/markForegrounded callers; delete no-ops in LaunchController.swift and scenePhase onChange block in HackerNewsApp.swift only if no other callers; keep launchController overlay and complete() once-ever logic. Log grep evidence.
